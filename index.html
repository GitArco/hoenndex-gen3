<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Monitoraggio script remoto</title>
</head>
<body>
  <h1>Stato Script "test.py"</h1>
  <ul id="log-list">Caricamento log...</ul>

  <script>
    const dbUrl = "https://monitorscriptremoto-default-rtdb.europe-west1.firebasedatabase.app/script_status_log.json";

    fetch(dbUrl)
      .then(response => response.json())
      .then(data => {
        const list = document.getElementById("log-list");
        list.innerHTML = "";

        const entries = Object.entries(data || {}).sort(([a], [b]) => b.localeCompare(a)).slice(0, 5);

        entries.forEach(([timestamp, record]) => {
          const li = document.createElement("li");
          const date = new Date(timestamp);
          li.textContent = `${date.toLocaleString()} – ${record.status.toUpperCase()}`;
          list.appendChild(li);
        });
      })
      .catch(error => {
        document.getElementById("log-list").innerText = "Errore nel caricamento del log.";
        console.error(error);
      });
  </script>
</body>
</html>
