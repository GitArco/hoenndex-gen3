<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoraggio Script Remoto</title>
</head>
<body>
  <h1>Stato dello script</h1>
  <p id="status">Caricamento stato...</p>

  <script>
    async function checkScriptStatus() {
      const statusEl = document.getElementById("status");

      try {
        statusEl.innerText = "🔄 Verifica in corso...";

        const response = await fetch("https://monitorscriptremoto-default-rtdb.europe-west1.firebasedatabase.app/script_status.json");

        if (!response.ok) throw new Error("Errore nella risposta");

        const data = await response.json();
        console.log("Dati ricevuti:", data);

        if (data && data.status === "active") {
          statusEl.innerText = "✅ Script ATTIVO";
        } else {
          statusEl.innerText = "❌ Script NON attivo";
        }

      } catch (err) {
        console.error("Errore:", err);
        statusEl.innerText = "❌ Errore nel recupero stato";
      }
    }

    // Avvio al load
    checkScriptStatus();

    // Refresh ogni 5 minuti
    setInterval(checkScriptStatus, 5 * 60 * 1000);
  </script>
</body>
</html>
