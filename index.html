<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Monitoraggio script remoto</title>
</head>
<body>
  <h1>Stato Script "test.py"</h1>
  <ul id="log-list">Caricamento log...</ul>

  <script>
    const dbUrl = "https://monitorscriptremoto-default-rtdb.europe-west1.firebasedatabase.app/script_status_log.json";

    fetch(dbUrl)
      .then(response => response.json())
      .then(data => {
        const list = document.getElementById("log-list");
        list.innerHTML = "";

        // Otteniamo le entries, ordiniamo per timestamp interno (record.timestamp) decrescente e prendiamo le ultime 5
        const entries = Object.values(data || {})
          .filter(record => record.timestamp && record.status)
          .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
          .slice(0, 5);

        if (entries.length === 0) {
          list.innerHTML = "<li>Nessun dato disponibile</li>";
          return;
        }

        entries.forEach(record => {
          const li = document.createElement("li");
          const date = new Date(record.timestamp);
          li.textContent = `${date.toLocaleString()} – ${record.status.toUpperCase()}`;
          list.appendChild(li);
        });
      })
      .catch(error => {
        document.getElementById("log-list").innerText = "Errore nel caricamento del log.";
        console.error(error);
      });
  </script>
</body>
</html>
