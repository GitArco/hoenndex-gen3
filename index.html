<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Monitoraggio Script Python</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background-color: #f0f2f5;
      color: #333;
      text-align: center;
    }
    .status {
      font-size: 2rem;
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 8px;
      display: inline-block;
      min-width: 250px;
    }
    .active {
      background-color: #d4edda;
      color: #155724;
      border: 2px solid #c3e6cb;
    }
    .inactive {
      background-color: #f8d7da;
      color: #721c24;
      border: 2px solid #f5c6cb;
    }
    .loading {
      font-size: 1.2rem;
      color: #666;
    }
  </style>
</head>
<body>

  <h1>Monitoraggio Script Python <code>test.py</code></h1>
  <div id="status" class="loading">Caricamento stato...</div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script>
    // Configurazione Firebase (da te fornita)
    const firebaseConfig = {
      apiKey: "AIzaSyD-gK0E_8vH5XKQVMxI8-v4wK44UhA_nZI",
      authDomain: "monitorscriptremoto.firebaseapp.com",
      databaseURL: "https://monitorscriptremoto-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "monitorscriptremoto",
      storageBucket: "monitorscriptremoto.firebasestorage.app",
      messagingSenderId: "880124239105",
      appId: "1:880124239105:web:e5e0dc905aa2f970380f00",
      measurementId: "G-SBJ4C3PR44"
    };

    // Inizializza Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Funzione per aggiornare lo stato
    function updateStatusUI(status) {
      const statusDiv = document.getElementById("status");
      if (status === "active") {
        statusDiv.textContent = "🟢 Script attivo";
        statusDiv.className = "status active";
      } else if (status === "inactive") {
        statusDiv.textContent = "🔴 Script non attivo";
        statusDiv.className = "status inactive";
      } else {
        statusDiv.textContent = "⚠️ Stato sconosciuto";
        statusDiv.className = "status inactive";
      }
    }

    // Funzione per leggere lo stato da Firebase
    function fetchStatus() {
      db.ref('script_status').get()
        .then((snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.val();
            updateStatusUI(data.status);
          } else {
            updateStatusUI(null);
          }
        })
        .catch((error) => {
          console.error("Errore nel recupero dati:", error);
          updateStatusUI(null);
        });
    }

    // Primo fetch e poi ogni 5 minuti (300000 ms)
    fetchStatus();
    setInterval(fetchStatus, 300000);
  </script>
</body>
</html>
